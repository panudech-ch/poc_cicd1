name: CD Android - Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, uat, prod, live]
      release_notes:
        description: "Release notes shown to testers"
        required: false
        default: "Manual build from workflow_dispatch"

concurrency:
  group: cd-android-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.4"
  ENVIRONMENT: ${{ inputs.environment }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  distribute:
    name: Build and distribute ${{ inputs.environment }} APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        run: flutter pub get

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          case "$ENVIRONMENT" in
            dev)       flutter build apk -t lib/main_dev.dart --flavor dev --release --build-number "$BUILD_NUMBER" ;;
            uat)       flutter build apk -t lib/main_uat.dart --flavor uat --release ;;
            prod|live) flutter build apk -t lib/main_prod.dart --flavor prod --release ;;
          esac

      - name: Compose release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            NOTES="$(git log -1 --pretty=format:'%s')"
          fi
          {
            echo "text<<EOF"
            echo "$NOTES"
            echo ""
            echo "Env: $ENVIRONMENT"
            echo "Commit: ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Upload to Firebase App Distribution
        working-directory: android
        env:
          FIREBASE_APP_ID_DEV: ${{ secrets.FIREBASE_APP_ID_DEV }}
          FIREBASE_APP_ID_UAT: ${{ secrets.FIREBASE_APP_ID_UAT }}
          FIREBASE_APP_ID_PROD: ${{ secrets.FIREBASE_APP_ID_PROD }}
          FIREBASE_SERVICE_CREDENTIALS_FILE: ${{ runner.temp }}/firebase-service-account.json
          RELEASE_NOTES: ${{ steps.notes.outputs.text }}
        run: |
          case "$ENVIRONMENT" in
            dev)  bundle exec fastlane firebase_app_distribution_release build_number:"$BUILD_NUMBER" ;;
            uat)  bundle exec fastlane uat_firebase_app_distribution_release ;;
            prod) bundle exec fastlane prod_firebase_app_distribution_release ;;
            live) bundle exec fastlane prod_firebase_app_distribution_live_release ;;
          esac

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties "$RUNNER_TEMP/firebase-service-account.json"
