name: CD - Firebase App Distribution

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown to testers"
        required: false
        default: "Manual build from workflow_dispatch"

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.4"
  TESTER_GROUPS: testers

jobs:
  distribute:
    name: Build and distribute dev APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --flavor dev --release

      - name: Compose release notes
        id: notes
        run: |
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            NOTES="$(git log -1 --pretty=format:'%s')"
          fi
          {
            echo "text<<EOF"
            echo "$NOTES"
            echo ""
            echo "Commit: ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ env.TESTER_GROUPS }}
          releaseNotes: ${{ steps.notes.outputs.text }}
          file: build/app/outputs/flutter-apk/app-dev-release.apk

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
